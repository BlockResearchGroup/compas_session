name: build

on:
  pull_request:
    branches: [main, c3-upgrade, initiative/repository-modernisation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          dependency-groups: dev
          extras: ""
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  distributions:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: dev
          extras: ""
      - name: Build distributions outside the checkout
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/source" "${RUNNER_TEMP}/dist"
          git archive HEAD | tar -xf - -C "${RUNNER_TEMP}/source"
          uv build --out-dir "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/source"
      - name: Verify and install the exact wheel
        shell: bash
        run: |
          uv run python .github/verify_distributions.py "${RUNNER_TEMP}/dist"
          uv run twine check "${RUNNER_TEMP}"/dist/*
          uv venv "${RUNNER_TEMP}/wheel-env"
          uv pip install \
            --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            "compas @ git+https://github.com/compas-dev/compas.git@3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e" \
            "pydantic>=2"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" --no-deps "${RUNNER_TEMP}"/dist/*.whl
          cp tests/typing/installed_consumer.py "${RUNNER_TEMP}/installed_consumer.py"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" "${RUNNER_TEMP}/installed_consumer.py"
          uv run --project "${GITHUB_WORKSPACE}" pyright \
            --pythonpath "${RUNNER_TEMP}/wheel-env/bin/python" \
            "${RUNNER_TEMP}/installed_consumer.py"
